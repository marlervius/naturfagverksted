<!DOCTYPE html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Naturfagverkstedet</title>
<meta name="description" content="3D-verksteder for naturfag på VG1. Bygg, forutsi og test – lær naturfag med hendene.">
<meta name="theme-color" content="#06141b">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="portal/portal.css">
</head>
<body>
<div class="bg" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></div>
<main class="wrap">
  <header class="hero">
    <p class="kicker">Naturfag VG1</p>
    <h1>Naturfagverkstedet</h1>
    <p class="lead">Bygg, forutsi og test. Her lærer du naturfag med hendene, i 3D.</p>
  </header>
  <section aria-labelledby="verk-h">
    <h2 id="verk-h" class="visually-hidden">Verksteder</h2>
    <ul class="grid" id="grid"></ul>
    <noscript><p class="note">Forsiden trenger JavaScript for å vise verkstedene.</p></noscript>
  </section>
</main>
<footer class="foot">
  <p>For lærere: legg til <code>#alle</code> bak adressen i et verksted for å åpne alle oppdrag.</p>
</footer>
<script type="module" src="portal/portal.js"></script>
</body>
</html>
